name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Vencord-AutoPatcher.ps1
            vencord-autopatcher.sh
            setup.bat
          generate_release_notes: true
